name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # publishing a release on a version tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the version in the .miz name

      - uses: jdx/mise-action@v2

      - run: mise run lint

      - run: mise run test

      - id: build
        run: mise run build

      - uses: actions/upload-artifact@v4
        with:
          name: Rotor_Gym_${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.miz }}

      - if: startsWith(github.ref, 'refs/tags/v')
        run: mise run release:publish
        env:
          GH_TOKEN: ${{ github.token }}
